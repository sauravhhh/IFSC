<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IFSC — Find Bank Branch Details</title>
<meta name="description" content="Find bank branch details by IFSC code. Minimal and fast.">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{
    --bg:#f2f2f7; --card:#ffffff; --txt:#111; --mut:#8e8e93;
    --acc:#0a58d6; --sep:#e5e5ea; --inp:#e9e9ee; --green:#1a9e4b; --red:#d93025;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#000; --card:#1c1c1e; --txt:#f2f2f7; --mut:#98989f;
      --acc:#4d9fff; --sep:#38383a; --inp:#2c2c2e; }
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
    background:var(--bg); color:var(--txt);}
  #app{max-width:560px;margin:0 auto;padding:calc(20px + env(safe-area-inset-top)) 16px 40px;}
  header{text-align:center;padding:14px 0 6px;}
  header img{width:72px;height:72px;border-radius:18px;}
  header h1{font-size:26px;margin:12px 0 4px;font-weight:700;letter-spacing:-.4px;}
  header p{margin:0;color:var(--mut);font-size:14px;}
  .field{margin:22px 0 0;position:relative;}
  .field input{width:100%;padding:15px 48px 15px 16px;font-size:18px;font-weight:600;letter-spacing:1.5px;
    text-transform:uppercase;border:1px solid var(--sep);border-radius:14px;
    background:var(--card);color:var(--txt);outline:none;text-align:center;}
  .clearIn{position:absolute;right:10px;top:50%;transform:translateY(-50%) scale(.6);width:28px;height:28px;
    border-radius:50%;border:none;background:var(--inp);color:var(--mut);font-size:13px;line-height:1;
    cursor:pointer;display:flex;align-items:center;justify-content:center;
    opacity:0;pointer-events:none;transition:opacity .18s ease,transform .18s ease;}
  .clearIn.on{opacity:1;pointer-events:auto;transform:translateY(-50%) scale(1);}
  .clearIn:active{opacity:.7;}
  .field input:focus{border-color:var(--acc);}
  .field input::placeholder{color:var(--mut);font-weight:400;letter-spacing:.3px;text-transform:none;}
  .hint{text-align:center;color:var(--mut);font-size:12px;margin-top:8px;}
  .btn{width:100%;padding:15px;font-size:16px;font-weight:600;border:none;border-radius:14px;
    background:var(--acc);color:#fff;cursor:pointer;margin-top:14px;}
  .btn:active{opacity:.85;} .btn:disabled{opacity:.5;}
  .card{background:var(--card);border-radius:16px;padding:20px;margin:18px 0 0;position:relative;
    box-shadow:0 1px 4px rgba(0,0,0,.07);animation:cardIn .28s ease;}
  @keyframes cardIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
  .card.out{opacity:0;transform:translateY(10px) scale(.98);transition:opacity .25s ease,transform .25s ease;}
  .card h2{margin:0 26px 2px 0;font-size:20px;letter-spacing:-.3px;font-weight:700;}
  .card .sub{color:var(--mut);font-size:13px;margin:0 0 8px;}
  .x{position:absolute;top:12px;right:12px;width:30px;height:30px;border-radius:50%;border:none;
    background:var(--inp);color:var(--mut);font-size:15px;line-height:1;cursor:pointer;
    display:flex;align-items:center;justify-content:center;}
  .x:active{opacity:.7;}
  .row{display:flex;justify-content:space-between;gap:14px;padding:10px 0;
    border-top:1px solid var(--sep);font-size:14px;}
  .row .k{color:var(--mut);flex-shrink:0;}
  .row .v{text-align:right;font-weight:500;word-break:break-word;}
  .actions{display:flex;gap:10px;margin-top:16px;}
  .actions button{flex:1;padding:13px;font-size:14px;font-weight:600;border-radius:12px;cursor:pointer;
    border:1px solid var(--sep);background:var(--card);color:var(--acc);}
  .actions button:active{background:var(--inp);}
  .actions .share{background:var(--acc);border-color:var(--acc);color:#fff;}
  .actions .share:active{opacity:.85;}
  .err{background:rgba(217,48,37,.08);border:1px solid rgba(217,48,37,.25);color:var(--red);
    border-radius:12px;padding:14px;font-size:14px;margin:18px 0 0;text-align:center;}
  .spin{width:26px;height:26px;border-radius:50%;border:3px solid var(--sep);
    border-top-color:var(--acc);animation:sp .8s linear infinite;margin:30px auto;}
  @keyframes sp{to{transform:rotate(360deg);}}
  .recent{margin-top:24px;}
  .recent h3{font-size:13px;color:var(--mut);font-weight:600;margin:0 2px 10px;text-transform:uppercase;letter-spacing:.6px;}
  .chips{display:flex;gap:8px;flex-wrap:wrap;}
  .chip{padding:8px 14px;border-radius:20px;background:var(--card);border:1px solid var(--sep);
    font-size:13px;font-weight:600;letter-spacing:.6px;cursor:pointer;color:var(--txt);}
  .chip:active{background:var(--inp);}
  .foot{text-align:center;color:var(--mut);font-size:11px;padding:26px 0 0;}
</style>
</head>
<body>
<div id="app">
  <header>
    <img src="icon-192.png" alt="IFSC logo">
    <h1>IFSC</h1>
    <p>Find bank branch details by IFSC code</p>
  </header>

  <div class="field">
    <input id="q" maxlength="11" placeholder="Enter IFSC code, e.g. SBIN0000001"
      autocomplete="off" autocapitalize="characters" spellcheck="false">
    <button class="clearIn" id="clearInput" aria-label="Clear">✕</button>
    <div class="hint">11 characters · 4 letters, then 0, then 6 numbers/letters</div>
  </div>
  <button class="btn" id="go">Search</button>

  <div id="out"></div>

  <div class="recent" id="recentBox" style="display:none">
    <h3>Recent</h3>
    <div class="chips" id="chips"></div>
  </div>

  <div class="foot">Data via Razorpay IFSC API · Works for all Indian banks</div>
</div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const IFSC_RE = /^[A-Z]{4}0[A-Z0-9]{6}$/;
let lastText = '';

function getRecent(){
  try{ return JSON.parse(localStorage.getItem('ifsc-recent')||'[]'); }catch(e){ return []; }
}
function pushRecent(code){
  let r = getRecent().filter(c=>c!==code);
  r.unshift(code); r = r.slice(0,6);
  try{ localStorage.setItem('ifsc-recent', JSON.stringify(r)); }catch(e){}
  renderRecent();
}
function renderRecent(){
  const r = getRecent();
  $('recentBox').style.display = r.length ? 'block' : 'none';
  $('chips').innerHTML = r.map(c=>'<button class="chip">'+esc(c)+'</button>').join('');
  $('chips').querySelectorAll('.chip').forEach(ch=>{
    ch.addEventListener('click', ()=>{ $('q').value = ch.textContent; search(); });
  });
}

function row(k, v){
  if(v == null || v === '') return '';
  return '<div class="row"><span class="k">'+k+'</span><span class="v">'+esc(v)+'</span></div>';
}

async function search(){
  const code = $('q').value.trim().toUpperCase();
  $('q').value = code;
  if(!IFSC_RE.test(code)){
    $('out').innerHTML = '<div class="err">Enter a valid 11-character IFSC code.</div>';
    return;
  }
  const btn = $('go');
  btn.disabled = true;
  $('out').innerHTML = '<div class="spin"></div>';
  try{
    const res = await fetch('https://ifsc.razorpay.com/' + encodeURIComponent(code));
    if(!res.ok) throw new Error('not found');
    const d = await res.json();
    lastText =
      'Bank: ' + (d.BANK||'') + '\n' +
      'Branch: ' + (d.BRANCH||'') + '\n' +
      'IFSC: ' + d.IFSC + '\n' +
      (d.MICR ? 'MICR: ' + d.MICR + '\n' : '') +
      'City: ' + (d.CITY||'') + '\n' +
      'State: ' + (d.STATE||'') + '\n' +
      'Address: ' + (d.ADDRESS||'');
    $('out').innerHTML =
      '<div class="card" id="resultCard">' +
        '<button class="x" id="closeCard" aria-label="Close">✕</button>' +
        '<h2>'+esc(d.BANK||'')+'</h2>' +
        '<p class="sub">'+esc(d.BRANCH||'')+'</p>' +
        row('IFSC', d.IFSC) +
        row('MICR', d.MICR) +
        row('Branch code', d.BRANCHCODE) +
        row('City', d.CITY) +
        row('District', d.DISTRICT) +
        row('State', d.STATE) +
        row('Address', d.ADDRESS) +
        row('Contact', d.CONTACT) +
        '<div class="actions">' +
          '<button id="copyBtn">Copy details</button>' +
          '<button id="shareBtn" class="share">Share</button>' +
        '</div>' +
      '</div>';
    $('closeCard').addEventListener('click', ()=>{
      const card = $('resultCard');
      if(!card) return;
      card.classList.add('out');
      setTimeout(()=>{ $('out').innerHTML=''; $('q').value=''; $('clearInput').classList.remove('on'); $('q').focus(); }, 260);
    });
    $('copyBtn').addEventListener('click', async ()=>{
      try{ await navigator.clipboard.writeText(lastText); $('copyBtn').textContent = 'Copied ✓'; }
      catch(e){ $('copyBtn').textContent = 'Copy failed'; }
      setTimeout(()=>{ const b=$('copyBtn'); if(b) b.textContent='Copy details'; }, 1500);
    });
    $('shareBtn').addEventListener('click', async ()=>{
      if(navigator.share){ try{ await navigator.share({title:'IFSC details', text:lastText}); }catch(e){} }
      else{ try{ await navigator.clipboard.writeText(lastText); $('shareBtn').textContent='Copied ✓'; }catch(e){} 
        setTimeout(()=>{ const b=$('shareBtn'); if(b) b.textContent='Share'; }, 1500); }
    });
    pushRecent(code);
  }catch(e){
    $('out').innerHTML = '<div class="err">No branch found for this IFSC code. Check the code and try again.</div>';
  }finally{
    btn.disabled = false;
  }
}

$('go').addEventListener('click', search);
$('q').addEventListener('keyup', e=>{ if(e.key === 'Enter') search(); });
$('q').addEventListener('input', ()=>{
  $('q').value = $('q').value.toUpperCase().replace(/[^A-Z0-9]/g,'');
  $('clearInput').classList.toggle('on', $('q').value.length > 0);
});
$('clearInput').addEventListener('click', ()=>{
  $('q').value = '';
  $('clearInput').classList.remove('on');
  const card = $('resultCard');
  if(card){ card.classList.add('out'); setTimeout(()=>{ $('out').innerHTML=''; }, 260); }
  $('q').focus();
});
renderRecent();
if('serviceWorker' in navigator){ try{ navigator.serviceWorker.register('sw.js'); }catch(e){} }
</script>
</body>
</html>
